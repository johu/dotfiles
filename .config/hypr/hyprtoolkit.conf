# Theme for hyprtoolkit apps (hyprpolkitagent, ...).
# Palette: tokyonight-moon, same values as colors/tokyonight-moon.colors.
# Changes apply the next time an app shows a window.

background       = rgb(222436)
base             = rgb(1b1d2b)
alternate_base   = rgb(2f334d)
text             = rgb(c8d3f5)
bright_text      = rgb(c8d3f5)
link_text        = rgb(82aaff)
accent           = rgb(82aaff)
accent_secondary = rgb(86e1fc)

rounding_large = 8
rounding_small = 4

font_family           = JetBrainsMono Nerd Font Propo
font_family_monospace = JetBrainsMono Nerd Font Mono
icon_theme            = TokyoNight-SE
